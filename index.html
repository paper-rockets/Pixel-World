<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4cc1e6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Lost Ducklings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div class="pill" aria-live="polite">
        <img src="assets/ui_duckling.png" alt="" />
        <span id="count">0 / 5</span>
      </div>
      <button id="sound" class="round" aria-label="Sound on or off">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
          <path class="on" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <button id="arrow" hidden aria-label="Go to Mama Duck">
      <img src="assets/ui_duck.png" alt="" />
      <span class="tip"></span>
    </button>

    <button id="sail" class="sail" hidden>
      <img src="boat/icon.png" alt="" />
      <span>Sail</span>
    </button>

    <div id="toast" role="status" hidden></div>

    <div id="start" class="overlay">
      <div class="card">
        <img class="hero" src="assets/ui_duckling.png" alt="" />
        <h1>Lost Ducklings</h1>
        <p>Mama Duck lost her <b>5</b> babies. Find them and bring them home.</p>
        <button id="play" class="big" disabled>Loading…</button>
        <p class="how" id="how">Tap or hold to walk</p>
      </div>
    </div>

    <div id="win" class="overlay" hidden>
      <div class="card">
        <img class="hero" src="assets/ui_duck.png" alt="" />
        <h1>All home!</h1>
        <p>Mama Duck is so happy. Thank you!</p>
        <button id="again" class="big">Play again</button>
        <button id="winSail" class="big quiet"><img src="boat/icon.png" alt="" /><span>Sail</span></button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
